<svg width="800" height="100" viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" result="noise" seed="0">
        <animate attributeName="seed" from="0" to="100" dur="1s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <style>
      .text {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        font-size: 60px;
        fill: #ff0055; /* DOOM Red */
        text-shadow: 2px 2px 0px #000;
        animation: colorPulse 2s infinite;
      }
      @keyframes colorPulse {
        0% { fill: #ff0055; }
        50% { fill: #ff9900; }
        100% { fill: #ff0055; }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#1a1a1a" />
  
  <!-- Base Text -->
  <text x="50%" y="70%" text-anchor="middle" class="text">WELCOME TO MY LAIR</text>
  
  <!-- Glitch Overlay -->
  <text x="50%" y="70%" text-anchor="middle" class="text" filter="url(#glitch)" opacity="0.7">WELCOME TO MY LAIR</text>
</svg>
